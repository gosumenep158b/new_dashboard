<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Login GO Sumenep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 28, 43, 0.2);
            box-shadow: 0 10px 40px -10px rgba(226, 28, 43, 0.15);
        }
        .bg-go-red {
            background-color: #e21c2b;
        }
        .text-go-red {
            color: #e21c2b;
        }
        .focus-ring-go-red:focus {
            --tw-ring-color: #e21c2b;
            border-color: #e21c2b;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-effect rounded-2xl w-full max-w-md p-8 relative overflow-hidden">
        
        <!-- Elemen dekoratif merah dan kuning -->
        <div class="absolute -top-12 -right-12 w-40 h-40 bg-red-500 rounded-full mix-blend-multiply filter blur-2xl opacity-40 animate-pulse"></div>
        <div class="absolute -bottom-12 -left-12 w-40 h-40 bg-yellow-400 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-pulse" style="animation-delay: 1s;"></div>

        <div class="relative z-10 flex flex-col items-center">
            
            <!-- Logo Ganesha Operation -->
            <div class="mb-6 w-full flex justify-center bg-white p-2 rounded-xl shadow-sm border border-gray-100">
                <img src="logo GO Standar.png" 
                     alt="Logo Ganesha Operation" 
                     class="h-16 md:h-20 object-contain drop-shadow-sm"
                     onerror="this.src='https://placehold.co/400x120/ffffff/e21c2b?text=Ganesha+Operation'">
            </div>

            <div class="text-center mb-8 w-full border-b border-gray-200 pb-4">
                <h1 class="text-2xl font-bold text-gray-800 mb-1">Sistem Database</h1>
                <p class="text-gray-500 text-sm font-medium">GO Sumenep TA 26/27 & SLP 27/28</p>
            </div>

            <form id="loginForm" class="space-y-6 w-full">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <div class="relative">
                        <select id="username" name="username" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus-ring-go-red transition-all outline-none bg-gray-50 focus:bg-white appearance-none cursor-pointer text-gray-700 font-medium">
                            <option value="" disabled selected>Memuat daftar username...</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-700">
                            <!-- Icon dropdown arrow -->
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password (NIK)</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus-ring-go-red transition-all outline-none bg-gray-50 focus:bg-white"
                        placeholder="Masukkan NIK Anda">
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-go-red text-white font-semibold py-3 rounded-lg hover:bg-red-700 transition-all transform hover:scale-[1.02] shadow-md flex justify-center items-center">
                    <span>Masuk ke Sistem</span>
                    <!-- Spinner loading tersembunyi secara default -->
                    <svg id="loadingSpinner" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>

            <!-- Container untuk pesan error/sukses -->
            <div id="messageBox" class="mt-4 p-3 rounded-lg text-sm text-center hidden w-full"></div>
        </div>
    </div>

    <script>
        // MASUKKAN URL APPS SCRIPT ANDA DI SINI
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwHTEqSxYruOyjWips4dVembVzDP2G7rizAtYANYV2ET3yhFr6lYdFMyO2UuS5PYvXe/exec';

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const messageBox = document.getElementById('messageBox');
        const usernameSelect = document.getElementById('username');

        // Fungsi Global untuk menerima data JSONP
        function handleUsersData(data) {
            if (data && data.success && data.users && data.users.length > 0) {
                usernameSelect.innerHTML = '<option value="" disabled selected>Pilih Username Anda</option>';
                data.users.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user;
                    option.textContent = user;
                    usernameSelect.appendChild(option);
                });
            } else {
                usernameSelect.innerHTML = '<option value="" disabled selected>Gagal memuat atau data kosong</option>';
                showMessage('Gagal memuat username dari database. Pastikan nama Sheet adalah "admin".', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('AKfycbz_XXXXXXXXXXXX_g')) {
                usernameSelect.innerHTML = '<option value="" disabled selected>URL Apps Script belum diatur</option>';
                return;
            }
            
            // MENGGUNAKAN TEKNIK JSONP UNTUK BYPASS CORS
            const script = document.createElement('script');
            // Menambahkan parameter action=getUsers dan callback=handleUsersData
            script.src = `${APPS_SCRIPT_URL}?action=getUsers&callback=handleUsersData`;
            script.onerror = function() {
                usernameSelect.innerHTML = '<option value="" disabled selected>Koneksi ke server gagal</option>';
            };
            document.body.appendChild(script);
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if(!username) {
                showMessage('Silakan pilih username terlebih dahulu.', 'error');
                return;
            }

            submitBtn.disabled = true;
            loadingSpinner.classList.remove('hidden');
            showMessage('', ''); 

            try {
                // Untuk login, karena menggunakan POST sering bermasalah dengan CORS,
                // kita gunakan GET request standard.
                const url = new URL(APPS_SCRIPT_URL);
                url.searchParams.append('action', 'login');
                url.searchParams.append('username', username);
                url.searchParams.append('password', password);

                const response = await fetch(url.toString(), {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('Login berhasil! Mengalihkan...', 'success');
                    setTimeout(() => {
                        alert('Simulasi: Redirect ke Dashboard');
                        // window.location.href = 'dashboard.html'; // Ganti dengan URL tujuan sebenarnya
                    }, 1500);
                } else {
                    showMessage(data.message || 'Username atau NIK salah', 'error');
                }
            } catch (error) {
                console.error('Error Login:', error);
                showMessage('Terjadi kesalahan jaringan atau CORS. Coba lagi nanti.', 'error');
            } finally {
                submitBtn.disabled = false;
                loadingSpinner.classList.add('hidden');
            }
        });

        function showMessage(text, type) {
            if (!text) {
                messageBox.classList.add('hidden');
                return;
            }
            messageBox.textContent = text;
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'border', 'border-red-200', 'border-green-200');
            
            if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-700', 'border', 'border-red-200');
            } else if (type === 'success') {
                messageBox.classList.add('bg-green-100', 'text-green-700', 'border', 'border-green-200');
            }
        }
    </script>
</body>
</html>
